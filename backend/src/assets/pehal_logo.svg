<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Reusable Styles & Definitions -->
  <defs>
    <style>
      .brand-orange { fill: #F58220; }
      .brand-green { fill: #00B140; }
      .brand-white { fill: #FFFFFF; }
      .brand-text { font-family: 'Inter', 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- ==================== BACKGROUND RINGS (SWOOSHES) ==================== -->
  <g id="Background-Rings">
    <!-- Top Swooshes -->
    <!-- Outermost Green Swoosh -->
    <path d="M 218 135 C 310 18, 590 10, 830 145 C 730 80, 480 70, 310 130 C 275 142, 235 142, 218 135 Z" fill="#00B140" />
    <!-- Middle Orange Swoosh -->
    <path d="M 285 160 C 370 70, 600 60, 715 155 C 640 110, 460 100, 350 152 C 325 164, 295 164, 285 160 Z" fill="#F58220" />
    <!-- Innermost Green Swoosh -->
    <path d="M 350 178 C 420 110, 560 105, 630 175 C 570 140, 470 135, 400 172 C 380 182, 360 182, 350 178 Z" fill="#00B140" />

    <!-- Bottom Swooshes (Mirrored and inverted) -->
    <!-- Outermost Green Swoosh -->
    <path d="M 782 565 C 690 682, 410 690, 170 555 C 270 620, 520 630, 690 570 C 725 558, 765 558, 782 565 Z" fill="#00B140" />
    <!-- Middle Orange Swoosh -->
    <path d="M 715 540 C 630 630, 400 640, 285 545 C 360 590, 540 600, 650 548 C 675 536, 705 536, 715 540 Z" fill="#F58220" />
    <!-- Innermost Green Swoosh -->
    <path d="M 650 522 C 580 590, 440 595, 370 525 C 430 560, 530 565, 600 528 C 620 518, 640 518, 650 522 Z" fill="#00B140" />
  </g>

  <!-- ==================== MAIN WORDMARK "PEHAL" ==================== -->
  <g id="PEHAL-Wordmark">
    <!-- Letter P -->
    <path d="M 2 290 L 160 290 C 205 290, 222 305, 222 342 L 222 360 C 222 398, 205 412, 160 412 L 72 412 L 72 470 L 2 470 L 2 315 L 25 290 Z M 72 338 L 72 364 L 152 364 L 152 338 Z" fill="#F58220" />
    
    <!-- Letter E -->
    <path d="M 238 290 L 388 290 L 388 335 L 308 335 L 308 355 L 380 355 L 380 400 L 308 400 L 308 425 L 392 425 L 392 470 L 238 470 Z" fill="#F58220" />
    
    <!-- Letter H (Left part, Right part, center replaced/overlayed by Medical Cross) -->
    <!-- H Left Stem -->
    <path d="M 408 290 L 478 290 L 478 470 L 408 470 Z" fill="#F58220" />
    <!-- H Right Stem -->
    <path d="M 568 290 L 638 290 L 638 470 L 568 470 Z" fill="#F58220" />
    
    <!-- Letter A -->
    <path d="M 654 470 L 714 290 L 784 290 L 844 470 L 772 470 L 760 425 L 710 425 L 698 470 Z M 720 375 L 750 375 L 735 320 Z" fill="#F58220" />
    
    <!-- Letter L -->
    <path d="M 860 290 L 930 290 L 930 425 L 998 425 L 998 470 L 860 470 Z" fill="#F58220" />
  </g>

  <!-- ==================== MEDICAL CROSS (Visual Focal Point) ==================== -->
  <g id="Medical-Cross">
    <!-- White Outline Border (Outer boundary to pop out from H stems) -->
    <path d="M 503 330 H 543 V 370 H 583 V 410 H 543 V 450 H 503 V 410 H 463 V 370 H 503 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
    <!-- Emerald Green Medical Cross -->
    <path d="M 506 335 H 540 V 373 H 578 V 407 H 540 V 445 H 506 V 407 H 468 V 373 H 506 Z" fill="#00B140" />
  </g>

  <!-- ==================== SECONDARY TEXT "HEALTHCARE" ==================== -->
  <g id="HEALTHCARE-Subtitle">
    <text x="500" y="535" fill="#00B140" font-family="'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="22" text-anchor="middle">HEALTHCARE</text>
  </g>
</svg>
